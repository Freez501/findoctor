<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      (function() {
        try {
          var h = window.location.hostname;
          var isLocal = h === 'localhost' || 
                        h === '127.0.0.1' || 
                        h === '0.0.0.0' || 
                        h.startsWith('192.168.') || 
                        h.startsWith('10.') || 
                        h.endsWith('.local') ||
                        window.location.port === '5173' ||
                        window.location.port === '3000' ||
                        window.location.port === '3001' ||
                        window.location.port === '3333';

          if (h.indexOf('fvds.ru') !== -1 || h.indexOf('shved4656') !== -1) {
            isLocal = false;
          }

          if (isLocal) {
            var links = document.querySelectorAll("link[rel*='icon']");
            links.forEach(function(link) {
              link.href = '/favicon-dev.svg';
            });
            if (document.title && !document.title.startsWith('[LOCAL]')) {
              document.title = '[LOCAL] ' + document.title;
            }
          }
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#363330" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FINDOCTOR" />
    <meta name="description" content="FINDOCTOR — Финансы, касса и реальная маржинальность выездных мероприятий, баров и кейтеринга" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>FINDOCTOR — Финансы и маржа выездных мероприятий</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #334155;">
        <h2>Требуется включить JavaScript</h2>
        <p>Для работы приложения FINDOCTOR необходим JavaScript в браузере.</p>
      </div>
    </noscript>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
